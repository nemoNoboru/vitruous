repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check
        language: system
        types: [python]
        pass_filenames: true

      - id: ty-check
        name: ty type check
        entry: uvx ty check app/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: bash -c 'PYTHONPATH=. uv run python3 -m pytest tests/ -v --tb=short'
        language: system
        pass_filenames: false
        always_run: true
