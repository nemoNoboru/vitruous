    <line x1="0" y1="-80" x2="0" y2="-49" stroke="#0a1628" stroke-width="5" stroke-linecap="round" transform="rotate(60)"/>
    <line x1="0" y1="-75" x2="0" y2="-46" stroke="#0a1628" stroke-width="5" stroke-linecap="round" transform="rotate(90)"/>
    <line x1="0" y1="-70" x2="0" y2="-43" stroke="#0a1628" stroke-width="5" stroke-linecap="round" transform="rotate(120)"/>
    <line x1="0" y1="-65" x2="0" y2="-40" stroke="#0a1628" stroke-width="5" stroke-linecap="round" transform="rotate(150)"/>
